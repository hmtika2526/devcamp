<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Offline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #171a26;
        color: #ffffff;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: bold;
        margin-bottom: 1rem;
      }
      p {
        font-size: 1.125rem;
        color: #9ca3af;
      }
      button {
        margin-top: 1.5rem;
        border-radius: 0.75rem;
        background: #2563eb;
        padding: 0.5rem 1rem;
        font-size: 1rem;
        color: #ffffff;
        border: none;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      button:hover {
        background: #1e40af;
      }
    </style>
  </head>
  <body>
    <h1>Kamu sedang offline</h1>
    <p>Silakan periksa koneksi internetmu.</p>
    <button onclick="window.location.reload()">Coba Lagi</button>
  </body>
</html>
